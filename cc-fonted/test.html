<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle System Test</title>
    <style>
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .test-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            min-width: 300px;
        }
        .particle-test {
            position: relative;
            width: 200px;
            height: 200px;
            background: rgba(0, 255, 136, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .test-particle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #00ff88;
            border-radius: 50%;
            pointer-events: none;
        }
        button {
            background: #00ff88;
            border: none;
            padding: 10px 20px;
            color: #0a0a0a;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #00ccff;
        }
        .log {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Particle System Test Suite</h1>

    <div class="test-container">
        <div class="test-section">
            <h2>Backend API Test</h2>
            <button onclick="testBackend()">Test Backend Connection</button>
            <button onclick="testImages()">Test Image Endpoint</button>
            <div id="backend-log" class="log"></div>
        </div>

        <div class="test-section">
            <h2>Particle Movement Test</h2>
            <div class="particle-test" id="particle-test">
                <div class="test-particle" id="test-particle"></div>
            </div>
            <button onclick="testMovement()">Start Movement Test</button>
            <button onclick="testWave()">Start Wave Test</button>
            <button onclick="stopTest()">Stop Test</button>
            <div id="particle-log" class="log"></div>
        </div>

        <div class="test-section">
            <h2>Configuration Test</h2>
            <button onclick="testConfig()">Test Configuration</button>
            <button onclick="testBrowserCompatibility()">Test Browser Compatibility</button>
            <div id="config-log" class="log"></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            backendUrl: 'http://localhost:3000',
            particleSize: 20,
            moveSpeed: 0.5,
            waveIntensity: 20,
            waveFrequency: 0.02
        };

        let testInterval = null;
        let wavePhase = 0;

        // 日志函数
        function log(message, elementId) {
            const logElement = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            logElement.innerHTML += `[${timestamp}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        // 测试后端连接
        async function testBackend() {
            log('Testing backend connection...', 'backend-log');
            try {
                const response = await fetch(`${CONFIG.backendUrl}/`);
                if (response.ok) {
                    log('Backend connection successful!', 'backend-log');
                } else {
                    log(`Backend responded with status: ${response.status}`, 'backend-log');
                }
            } catch (error) {
                log(`Backend connection failed: ${error.message}`, 'backend-log');
            }
        }

        // 测试图片端点
        async function testImages() {
            log('Testing images endpoint...', 'backend-log');
            try {
                const response = await fetch(`${CONFIG.backendUrl}/api/images`);
                if (response.ok) {
                    const data = await response.json();
                    log(`Images API successful! Count: ${data.count}`, 'backend-log');
                    if (data.images && data.images.length > 0) {
                        log(`First image: ${data.images[0].url}`, 'backend-log');
                    }
                } else {
                    log(`Images API responded with status: ${response.status}`, 'backend-log');
                }
            } catch (error) {
                log(`Images API failed: ${error.message}`, 'backend-log');
            }
        }

        // 测试粒子运动
        function testMovement() {
            log('Testing particle movement...', 'particle-log');
            stopTest();

            const particle = document.getElementById('test-particle');
            let x = 90, y = 90;
            let vx = (Math.random() - 0.5) * CONFIG.moveSpeed;
            let vy = (Math.random() - 0.5) * CONFIG.moveSpeed;

            testInterval = setInterval(() => {
                x += vx;
                y += vy;

                // 边界碰撞
                if (x <= 0 || x >= 180) vx *= -1;
                if (y <= 0 || y >= 180) vy *= -1;

                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
            }, 16);
        }

        // 测试波动效果
        function testWave() {
            log('Testing wave movement...', 'particle-log');
            stopTest();

            const particle = document.getElementById('test-particle');
            wavePhase = 0;

            testInterval = setInterval(() => {
                wavePhase += CONFIG.waveFrequency;
                const waveX = Math.sin(wavePhase) * CONFIG.waveIntensity;
                const waveY = Math.cos(wavePhase * 0.8) * CONFIG.waveIntensity;

                const x = 90 + waveX;
                const y = 90 + waveY;

                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
            }, 16);
        }

        // 停止测试
        function stopTest() {
            if (testInterval) {
                clearInterval(testInterval);
                testInterval = null;
                log('Test stopped', 'particle-log');
            }
        }

        // 测试配置
        function testConfig() {
            log('Testing configuration...', 'config-log');
            log(`Backend URL: ${CONFIG.backendUrl}`, 'config-log');
            log(`Particle Size: ${CONFIG.particleSize}px`, 'config-log');
            log(`Move Speed: ${CONFIG.moveSpeed}`, 'config-log');
            log(`Wave Intensity: ${CONFIG.waveIntensity}`, 'config-log');
            log(`Wave Frequency: ${CONFIG.waveFrequency}`, 'config-log');

            // 测试浏览器功能
            if (window.requestAnimationFrame) {
                log('requestAnimationFrame supported ✓', 'config-log');
            } else {
                log('requestAnimationFrame not supported ❌', 'config-log');
            }

            if (fetch) {
                log('Fetch API supported ✓', 'config-log');
            } else {
                log('Fetch API not supported ❌', 'config-log');
            }
        }

        // 测试浏览器兼容性
        function testBrowserCompatibility() {
            log('Testing browser compatibility...', 'config-log');

            const tests = [
                { name: 'CSS Variables', test: () => CSS && CSS.supports && CSS.supports('color', 'var(--primary-color)') },
                { name: 'Flexbox', test: () => CSS.supports('display', 'flex') },
                { name: 'Grid Layout', test: () => CSS.supports('display', 'grid') },
                { name: 'Transform Style', test: () => CSS.supports('transform-style', 'preserve-3d') },
                { name: 'Backdrop Filter', test: () => CSS.supports('backdrop-filter', 'blur(10px)') }
            ];

            tests.forEach(test => {
                const result = test.test() ? '✓' : '❌';
                log(`${test.name}: ${result}`, 'config-log');
            });
        }

        // 页面加载完成后自动测试配置
        window.addEventListener('load', () => {
            log('Page loaded successfully', 'config-log');
            testConfig();
        });
    </script>
</body>
</html>
