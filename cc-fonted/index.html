<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNNY 誓师大会签名墙 v2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #050508;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #fff;
            width: 1080px;
            height: 1920px;
            margin: 0 auto;
            position: relative;
        }

        #app-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vmax;
            height: 80vmax;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, rgba(255, 215, 0, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Progress Display */
        .progress-container {
            position: fixed;
            top: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 10;
        }

        .progress-text {
            font-size: 12px;
            letter-spacing: 0.2em;
            color: rgba(255, 215, 0, 0.7);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 150px;
            height: 2px;
            background: rgba(255, 215, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #ffd700;
            transition: width 0.5s ease-out;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Signature Controls */
        .signature-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .signature-input {
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: #fff;
            font-size: 14px;
            width: 200px;
            backdrop-filter: blur(10px);
        }

        .signature-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .signature-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 50px;
            color: #000;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .signature-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        /* Status Display */
        .status-display {
            position: fixed;
            top: 30px;
            left: 30px;
            font-size: 14px;
            color: rgba(255, 215, 0, 0.8);
            z-index: 10;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        /* Grain Overlay */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>
    <div id="app-container"></div>
    <div class="ambient-glow"></div>
    <div class="noise"></div>
    
    <div class="status-display" id="status-display">
        等待签名...
    </div>

    <div class="progress-container">
        <div class="progress-text" id="progress-text">签名进度</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="signature-controls">
        <input type="text" class="signature-input" id="signature-input" placeholder="输入工号">
        <button class="signature-btn" id="signature-btn">签名</button>
    </div>

    <!-- PixiJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script type="module" src="./app.js"></script>
</body>
</html>
