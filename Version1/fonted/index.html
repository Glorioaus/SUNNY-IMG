<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNNY | Digital Swarm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #050508; /* Even deeper dark */
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: #fff;
        }

        #app-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vmax;
            height: 80vmax;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, rgba(255, 215, 0, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Loading Overlay - Simplified since we use sequential entry */
        #loader {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 10;
            pointer-events: none;
        }

        .loader-text {
            font-size: 10px;
            letter-spacing: 0.3em;
            color: rgba(255, 215, 0, 0.5);
            text-transform: uppercase;
        }

        .progress-bar {
            width: 120px;
            height: 1px;
            background: rgba(255, 215, 0, 0.1);
            margin-top: 5px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 0%;
            background: #ffd700;
            transition: width 0.3s ease-out;
        }

        /* Controls Hint */
        .controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-size: 11px;
            color: rgba(255, 215, 0, 0.4);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease 1s;
        }
        
        .controls.visible {
            opacity: 1;
        }

        /* Grain Overlay */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
    <div id="app-container"></div>
    <div class="ambient-glow"></div>
    <div class="noise"></div>
    
    <div id="loader">
        <div class="loader-text">SYNCING SWARM</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="controls" id="controls">
        CLICK TO EXPLORE THE SWARM
    </div>

    <!-- PixiJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script type="module" src="./app.js"></script>
</body>
</html>
